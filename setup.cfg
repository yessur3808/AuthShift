[metadata]
name = google-auth-to-bitwarden
version = 1.0.0
description = Convert Google Authenticator export QR codes to Bitwarden JSON
long_description = file: README.md
long_description_content_type = text/markdown

[options]
py_modules = google_auth_to_bitwarden
python_requires = >=3.9
install_requires =
    opencv-python-headless>=4.8

[options.entry_points]
console_scripts =
    google-auth-to-bitwarden = google_auth_to_bitwarden:main
